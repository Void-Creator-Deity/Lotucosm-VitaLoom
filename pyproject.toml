# 基于继承算法实现的AI生命体模拟系统 - 项目配置文件
# 此文件使用PEP 621格式，用于定义项目的基本信息、依赖关系和构建配置

# =======================
# 项目基本信息配置
# =======================
[project]
# 项目名称 - 用于包管理和发布
name = "ai-organism-based-on-inheritance-algorithm"

# 项目版本 - 遵循语义化版本规则 (MAJOR.MINOR.PATCH)
# 修改规则：
# - 大版本号(MAJOR)：不兼容的API修改
# - 小版本号(MINOR)：向下兼容的功能性新增
# - 修订号(PATCH)：向下兼容的问题修正
version = "0.1.0"

# 项目描述 - 简短介绍项目的功能和用途
description = "基于继承算法实现的AI生命体模拟系统"

# 项目README文件路径 - 用于包发布和文档生成
readme = "README.md"

# Python版本要求 - 项目支持的最低Python版本
requires-python = ">=3.12"

# 项目作者信息 - 用于包发布和版权声明
authors = [
    { name = "AI生命体研究团队", email = "your-email@example.com" },
]

# 项目许可证 - 定义项目的开源协议
# 使用SPDX表达式格式，符合最新的setuptools要求
license = "MIT"

# 项目分类器 - 用于PyPI搜索和分类
# 分类器列表：https://pypi.org/classifiers/
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Simulation",
    "Topic :: Games/Entertainment :: Simulation",
]

# 核心依赖配置
# 项目运行必需的依赖包
# 格式：包名>=版本号 (或使用==精确匹配)
dependencies = [
    "numpy>=2.3.4",  # 数值计算库，用于向量和矩阵运算
    "pygame>=2.6.1",  # 游戏开发库，用于可视化模拟界面
    "pyqt6>=6.10.0",  # 现代化GUI框架，用于AI生命体编辑器和启动器
]

# =======================
# setuptools 特定配置
# =======================
[tool.setuptools]
# 明确指定要包含的包，解决multiple top-level packages错误
packages = [
    "ai_organism",
    "ai_organism.core",
    "ai_organism.editor",
    "ai_organism.editor.ui",
    "ai_organism.environment",
    "ai_organism.launcher",
    "ai_organism.simulation",
    "ai_organism.tools",
]

# =======================
# 构建系统配置
# =======================
# 用于定义项目的构建方式和依赖
[build-system]
# 构建项目所需的工具和版本要求
requires = ["setuptools>=61.0.0", "wheel"]
# 构建后端 - 指定使用setuptools构建项目
build-backend = "setuptools.build_meta"

# =======================
# 开发依赖配置
# =======================
# 仅在开发环境中需要的依赖包
[project.optional-dependencies]
dev = [
    "flake8>=7.3.0",  # 代码风格检查工具
]

# =======================
# 配置修改说明
# =======================
# 如何修改配置：
# 1. 项目基本信息：直接修改对应的字段值
# 2. 添加依赖：在dependencies或dev列表中添加新的依赖项
# 3. 修改版本要求：更新对应的版本号
# 4. 添加分类器：从PyPI分类器列表中选择合适的分类器

# 配置文件限制：
# - 必须使用UTF-8编码
# - 遵循TOML格式规范
# - 版本号必须符合PEP 440规范
# - 依赖包名称必须与PyPI上的名称一致

# 注意事项：
# - 修改配置后，建议重新安装依赖：
#   - 使用uv：uv install
#   - 使用pip：pip install -r requirements.txt
# - 开发依赖的安装：uv install -d (或pip install -r requirements-dev.txt)
