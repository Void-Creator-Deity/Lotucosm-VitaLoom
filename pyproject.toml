[project]
name = "lotucosm-vitaloom"
version = "1.0.0"
description = "Lotucosm-VitaLoom living-world editor packaged as a FrameCore plugin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lotucosm-VitaLoom Contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "numpy>=2.3.4",
    "pygame>=2.6.1",
    "pyqt6>=6.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "flake8>=7.3.0",
    "pyinstaller>=6.0",
    "cryptography>=42.0",
]
native-build = [
    "cmake>=3.18,<4",
    "ninja>=1.11",
    "pybind11>=2.12",
    "scikit-build-core>=0.9",
]

[project.urls]
Homepage = "https://github.com/Void-Creator-Deity/Lotucosm-VitaLoom"
Repository = "https://github.com/Void-Creator-Deity/Lotucosm-VitaLoom"
Documentation = "https://github.com/Void-Creator-Deity/Lotucosm-VitaLoom/blob/main/docs/INDEX.md"
Issues = "https://github.com/Void-Creator-Deity/Lotucosm-VitaLoom/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["FrameCore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
