[project]
name = "lotucosm-vitaloom"
version = "1.0.0"
description = "莲池生命织机 (Lotucosm + VitaLoom) with PVAEC simulation extension"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Lotucosm-VitaLoom Contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "numpy>=2.3.4",
    "pygame>=2.6.1",
    "pyqt6>=6.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "flake8>=7.3.0",
]

[project.urls]
Homepage = "https://github.com/your-org/lotucosm-vitaloom"
Documentation = "https://github.com/your-org/lotucosm-vitaloom/blob/main/docs/INDEX.md"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "builtin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
